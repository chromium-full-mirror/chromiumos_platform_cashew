# cashew upstart job

env CASHEW_LOGDIR=/var/log/cashew

start on started flimflam
stop on starting halt or starting reboot
respawn
pre-start exec mkdir -p -m 0755 $CASHEW_LOGDIR
exec /usr/sbin/cashewd --log_dir=$CASHEW_LOGDIR --logbuflevel=-1
